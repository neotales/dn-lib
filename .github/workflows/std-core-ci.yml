# std/Core restore, build, test, format, and pack through std.slnx.
#
# One solution command covers every project in std, so the SDK schedules those
# projects together instead of a step per project. After restore, the same
# solution is audited for known NuGet vulnerabilities, including transitive
# packages. Packed nupkgs are uploaded as workflow artifacts. Dev builds also
# publish 0.0.0-build-yyyyMMdd.rN to GitHub Packages and keep the newest five
# of those versions. The SDK pin check is .github/workflows/check-build-pins.yml.
# Release tags are published by .github/workflows/release.yml.
#
# Third-party actions are pinned to commit SHAs. The version in the trailing
# comment is what a reviewer checks. eng/scripts/check-action-pins.cs fails a
# tag reference and a SHA that does not name its version.
name: std Core ci

on:
  pull_request:
    branches:
      - "**"
    paths:
      - "std/**"
  push:
    branches:
      - "**"
    paths:
      - "std/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: std-core-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # A job must not inherit a package cache from another job or from the runner
  # image. github.workspace is available here; runner is not.
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget

jobs:
  build:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # History is not required for the package version. The version script
          # reads Directory.Build.props and the workflow run number.
          fetch-depth: 0

      - name: Install the pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
        env:
          # setup-dotnet installs into /usr/share/dotnet unless this is set.
          # That directory is not writable on every runner. The workspace is.
          DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

      - name: Restore
        run: dotnet restore std.slnx --locked-mode

      - name: NuGet audit
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/nuget-audit.txt"
          dotnet list std.slnx package --vulnerable --include-transitive --no-restore | tee "$report"
          if grep -F 'has the following vulnerable packages' "$report" >/dev/null; then
            echo "NuGet audit found vulnerable packages."
            exit 1
          fi
          if ! grep -F 'has no vulnerable packages' "$report" >/dev/null; then
            echo "NuGet audit did not report a result for the solution."
            exit 1
          fi

      - name: Build
        run: dotnet build std.slnx -c Release --no-restore

      - name: Test
        run: dotnet test std.slnx -c Release --no-build

      - name: Format
        run: dotnet format std.slnx --verify-no-changes --no-restore

      - name: Package version
        id: package_version
        env:
          REVISION: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version="$(dotnet ./eng/scripts/package-version.cs ci --date "$(date -u +%Y%m%d)" --revision "$REVISION")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "${version}"

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.version }}
        run: dotnet pack std.slnx -c Release --no-build -p:PackageVersion="$PACKAGE_VERSION"

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.os }}-${{ steps.package_version.outputs.version }}
          path: .artifacts/packages/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish the dev build to GitHub Packages
        if: runner.os == 'Linux' && github.ref == 'refs/heads/dev'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          dotnet ./eng/scripts/push-packages.cs github .artifacts/packages
          dotnet ./eng/scripts/github-packages.cs prune-builds --keep 5 --packages-dir .artifacts/packages

      - name: Lint workflows
        if: runner.os == 'Linux'
        run: |
          dotnet ./eng/scripts/check-action-pins.cs .github/workflows/*.yml
          bash eng/scripts/actionlint.sh .github/workflows/*.yml
          dotnet ./eng/scripts/package-version.cs check
          dotnet ./eng/scripts/bump-version.cs check
          dotnet ./eng/scripts/github-packages.cs check
          dotnet ./eng/scripts/check-action-pins.cs check

      - name: Whitespace
        run: git diff --check
