# The SDK pin in global.json, checked against the download hosts.
#
# This is its own workflow so a build does not repeat the check on every
# operating system. The script asks every host and architecture from one
# runner. A tag-pinned action is still rejected by eng/scripts/check-action-pins.cs
# in the std Core workflow.
name: check build pins

on:
  pull_request:
    branches:
      - "**"
    paths:
      - "std/**"
  push:
    branches:
      - "**"
    paths:
      - "std/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-build-pins-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  sdk:
    name: SDK pin
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
        env:
          # setup-dotnet installs into /usr/share/dotnet unless this is set.
          # That directory is not writable on every runner. The workspace is.
          DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

      - name: The pinned SDK can be installed
        run: dotnet ./eng/scripts/check-sdk-pin.cs
