# Publish a tagged release. The tag date identifies the release. The package
# version comes from Directory.Build.props: vYYYY.M.D-r.N uses that version as
# is, and -alpha.N, -beta.N, and -rc.N are appended. Those versions stay on
# GitHub Packages. They also go to nuget.org unless SKIP_NUGET_ORG is true
# or the manual run sets skip_nuget_org.
name: release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v2026.10.31-r.1
        required: true
        type: string
      skip_nuget_org:
        description: Skip publishing this release to nuget.org
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget

jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install the pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
        env:
          DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

      - name: Package version
        id: package_version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(dotnet ./eng/scripts/package-version.cs tag "$RELEASE_TAG")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "${version}"

      - name: Restore
        run: dotnet restore std.slnx --locked-mode

      - name: Build
        run: dotnet build std.slnx -c Release --no-restore

      - name: Test
        run: dotnet test std.slnx -c Release --no-build

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.version }}
        run: dotnet pack std.slnx -c Release --no-build -p:PackageVersion="$PACKAGE_VERSION"

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ steps.package_version.outputs.version }}
          path: .artifacts/packages/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: dotnet ./eng/scripts/push-packages.cs github .artifacts/packages

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          SKIP_NUGET_ORG: ${{ vars.SKIP_NUGET_ORG }}
          SKIP_NUGET_ORG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_nuget_org && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "${SKIP_NUGET_ORG}" = "true" ] || [ "${SKIP_NUGET_ORG_INPUT}" = "true" ]; then
            echo "Skipping nuget.org."
            exit 0
          fi
          dotnet ./eng/scripts/push-packages.cs nuget .artifacts/packages
