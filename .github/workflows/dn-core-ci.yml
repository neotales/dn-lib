# Build and test Neotales.Core on the published satellite. The name is
# dn-core-ci so it does not clash with another runtime's workflow.
name: dn-core-ci

on:
  pull_request:
    paths:
      - "std/Core/**"
      - "cmn/**"
      - "lib.slnx"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "global.json"
      - ".editorconfig"
      - "stylecop.json"
      - "LICENSE.md"
      - ".github/workflows/dn-core-ci.yml"
  push:
    branches:
      - "**"
    paths:
      - "std/Core/**"
      - "cmn/**"
      - "lib.slnx"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "global.json"
      - ".editorconfig"
      - "stylecop.json"
      - "LICENSE.md"
      - ".github/workflows/dn-core-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dn-core-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget
  CI: "true"

jobs:
  build:
    name: dn-core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
        env:
          DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

      - name: Restore
        run: dotnet restore lib.slnx --locked-mode

      - name: Build
        run: dotnet build lib.slnx -c Release --no-restore

      - name: Test
        run: dotnet test lib.slnx -c Release --no-build

      - name: Format
        if: matrix.os == 'ubuntu-24.04'
        run: dotnet format lib.slnx --verify-no-changes --no-restore
